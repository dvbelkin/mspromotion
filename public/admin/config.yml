backend:
  name: github
  repo: dvbelkin/mspromotion
  branch: redesign-modern-ui
  base_url: https://auth.ms-promotion.ru
  auth_endpoint: auth
  auth_scope: repo


local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: "https://www.ms-promotion.ru"
display_url: "https://www.ms-promotion.ru"

collections:
  - name: "projects"
    label: "Projects (Homepage)"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}} - {{year}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Industry", name: "industry", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Year", name: "year", widget: "number", required: false, value_type: "int" }
      - { label: "Short Description", name: "descriptionShort", widget: "text" }
      - { label: "Cover Image", name: "coverImage", widget: "image" }
      - { label: "Slug", name: "slug", widget: "string", required: false }
      - label: "Gallery"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - { label: "Image", name: "image", widget: "image" }
          - { label: "Caption", name: "caption", widget: "string", required: false }
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["draft", "published"]
        default: "draft"
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Pages"
    files:
      - label: "Services"
        name: "services"
        file: "src/content/pages/services.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Short Description", name: "descriptionShort", widget: "text" }
          - label: "Status"
            name: "status"
            widget: "select"
            options: ["draft", "published"]
            default: "published"
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Contact"
        name: "contact"
        file: "src/content/pages/contact.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Short Description", name: "descriptionShort", widget: "text" }
          - label: "Status"
            name: "status"
            widget: "select"
            options: ["draft", "published"]
            default: "published"
          - { label: "Body", name: "body", widget: "markdown" }
