server {
    listen 80;
    listen [::]:80;
    server_name ms-promotion.ru www.ms-promotion.ru web2.ms;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ms-promotion.ru www.ms-promotion.ru web2.ms;

    # Если деплой через releases/current:
    root /var/www/mspromotion/current;
    # Если без current-симлинка, замените на:
    # root /var/www/mspromotion;

    index index.html;
    charset utf-8;
    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/www.ms-promotion.ru-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ms-promotion.ru-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Static routing: unknown paths must return 404
    location / {
        try_files $uri $uri/ =404;
    }

    # Скрыть /events и /promos из индексации на уровне заголовков
    location ~* ^/(events|promos)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
    }

    # Кэш статики
    location ~* ^/_astro/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|gif|png|webp|svg|ico|woff|woff2|ttf|eot)$ {
        access_log off;
        expires 14d;
        add_header Cache-Control "public, max-age=1209600" always;
        try_files $uri =404;
    }

    # HTML не кешируем агрессивно
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/javascript application/json text/xml application/xml application/xml+rss image/svg+xml;
}

